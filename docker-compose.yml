services:
  user-service:
    build: ./user-service
    ports:
      - "5000:5000"
    environment:
      - DB_PATH=/data/users.db
    volumes:
      - user-db:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  notification-service:
    build: ./notification-service
    ports:
      - "5001:5001"
    environment:
      - DB_PATH=/data/notifications.db
    volumes:
      - notification-db:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  order-service:
    build: ./order-service
    ports:
      - "5002:5002"
    environment:
      - DB_PATH=/data/orders.db
      - USER_SERVICE_URL=http://user-service:5000
      - NOTIFICATION_SERVICE_URL=http://notification-service:5001
    volumes:
      - order-db:/data
    depends_on:
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  user-db:
  order-db:
  notification-db:
